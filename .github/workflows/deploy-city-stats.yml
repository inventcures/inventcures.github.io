name: Deploy city stats worker

# Deploys worker/ (city-level visitor counts) to Cloudflare.
# See docs/city-visitor-stats-spec.md, section 11.
# Needs repo secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and
# CITY_STATS_ADMIN_TOKEN. Without them it exits early with a note.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-city-stats.yml"

concurrency:
  group: deploy-city-stats
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TOKEN: ${{ secrets.CITY_STATS_ADMIN_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        id: check
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$ADMIN_TOKEN" ] || missing="$missing CITY_STATS_ADMIN_TOKEN"
          if [ -n "$missing" ]; then
            echo "::notice::City stats not deployed; missing secrets:$missing (see docs/city-visitor-stats-spec.md §11)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Install wrangler
        if: steps.check.outputs.skip != 'true'
        run: npm install --no-save --no-audit --no-fund wrangler@4.157.0

      - name: Create the D1 database if needed
        if: steps.check.outputs.skip != 'true'
        run: |
          id=$(npx wrangler d1 list --json | python3 -c "import json,sys; print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='visitor-cities'), ''))")
          if [ -z "$id" ]; then
            npx wrangler d1 create visitor-cities
            id=$(npx wrangler d1 list --json | python3 -c "import json,sys; print(next(d['uuid'] for d in json.load(sys.stdin) if d['name']=='visitor-cities'))")
          fi
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          echo "D1 database id: $id"

      - name: Apply schema
        if: steps.check.outputs.skip != 'true'
        run: npx wrangler d1 execute visitor-cities --remote --file schema.sql

      - name: Deploy
        if: steps.check.outputs.skip != 'true'
        run: |
          npx wrangler deploy | tee deploy.log
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          {
            echo "### City stats worker deployed"
            echo ""
            echo "Worker URL: \`$url\`"
            echo ""
            echo "Set \`visitor_stats.cities_endpoint: \"$url\"\` in \`_config.yml\` to turn it on."
          } >> "$GITHUB_STEP_SUMMARY"
          # A brand-new workers.dev URL can take a minute to start answering.
          for i in $(seq 1 12); do
            if curl -fsS "$url/health"; then exit 0; fi
            sleep 10
          done
          echo "::warning::Deployed, but $url/health did not answer within 2 minutes; check it again shortly."
