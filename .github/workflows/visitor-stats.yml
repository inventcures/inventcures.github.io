name: Update visitor stats

# Pulls the cumulative visitor total and per-country counts from GoatCounter
# into _data/visitor_stats.json, which the homepage renders as a count and a
# world heatmap. Needs a repository secret named GOATCOUNTER_TOKEN.

on:
  schedule:
    - cron: "17 2 * * *" # daily, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visitor-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch stats from GoatCounter
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 scripts/update_visitor_stats.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/visitor_stats.json; then
            echo "No change in visitor stats."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/visitor_stats.json
          git commit -m "Update visitor stats"
          git push
