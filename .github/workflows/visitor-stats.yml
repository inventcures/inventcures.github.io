name: Update visitor stats

# Pulls the cumulative visitor total and per-country counts from GoatCounter
# into _data/visitor_stats.json, which the homepage renders as a count and a
# world heatmap. Needs a repository secret named GOATCOUNTER_TOKEN.

on:
  schedule:
    - cron: "17 2 * * *" # daily, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visitor-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch stats from GoatCounter
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 scripts/update_visitor_stats.py

      - name: Commit if changed
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # master can move while this job runs (e.g. a PR merged meanwhile). If the
          # push is rejected, start again from the latest master and retry.
          for attempt in 1 2 3; do
            if git diff --quiet -- _data/visitor_stats.json; then
              echo "No change in visitor stats."
              exit 0
            fi
            git add _data/visitor_stats.json
            git commit -q -m "Update visitor stats"
            if git push origin HEAD:${GITHUB_REF_NAME}; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); refreshing from origin and retrying."
            sleep $((attempt * 5))
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            python3 scripts/update_visitor_stats.py
          done
          echo "::error::Could not push visitor stats after 3 attempts."
          exit 1
