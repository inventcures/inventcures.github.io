{%- comment -%}
Substack-style video player. Usage:
{% include substack-player.html id="lo" src="/files/video/x.mp4" poster="/files/video/x.jpg" vtt="/files/video/x.vtt" title="..." youtube="https://youtu.be/..." %}
{%- endcomment -%}
{%- assign pid = include.id | default: "sp" -%}
<figure class="sp-wrap" id="{{ pid }}">
  <div class="sp-stage">
    <video class="sp-video" preload="metadata" playsinline poster="{{ include.poster | relative_url }}" title="{{ include.title | escape }}">
      <source src="{{ include.src | relative_url }}" type="video/mp4">
      {%- if include.vtt %}<track kind="captions" srclang="en" label="English" src="{{ include.vtt | relative_url }}" default>{% endif %}
    </video>
    <div class="sp-audio-card" aria-hidden="true"><img src="{{ include.poster | relative_url }}" alt=""><span>Listening to audio only</span></div>
    <div class="sp-caption" aria-live="off"></div>
    <button class="sp-big" type="button" aria-label="Play">
      <svg viewBox="0 0 16 16" width="22" height="22" fill="#fff"><path d="M3.36 16C2.58 16 2 15.41 2 14.44V1.56C2 .6 2.58 0 3.36 0c.39 0 .74.13 1.19.39l10.61 6.15c.8.47 1.15.85 1.15 1.46 0 .62-.35 1-1.15 1.46L4.55 15.6c-.45.26-.8.4-1.19.4Z"/></svg>
    </button>
    <div class="sp-modes" role="group" aria-label="Watch or listen">
      <button type="button" class="sp-mode on" data-mode="video" aria-label="Video">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3"/></svg>
      </button>
      <button type="button" class="sp-mode" data-mode="audio" aria-label="Audio only">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
      </button>
    </div>
    <div class="sp-bar">
      <div class="sp-progress" role="slider" aria-label="Seek" tabindex="0"><div class="sp-buf"></div><div class="sp-fill"></div><div class="sp-knob"></div></div>
      <div class="sp-row">
        <button type="button" class="sp-btn sp-play" aria-label="Play">
          <svg class="i-play" viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M3.36 16C2.58 16 2 15.41 2 14.44V1.56C2 .6 2.58 0 3.36 0c.39 0 .74.13 1.19.39l10.61 6.15c.8.47 1.15.85 1.15 1.46 0 .62-.35 1-1.15 1.46L4.55 15.6c-.45.26-.8.4-1.19.4Z"/></svg>
          <svg class="i-pause" viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><rect x="2.5" y="1" width="4" height="14" rx="1.2"/><rect x="9.5" y="1" width="4" height="14" rx="1.2"/></svg>
        </button>
        <button type="button" class="sp-btn sp-back" aria-label="Back 15 seconds">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button type="button" class="sp-btn sp-fwd" aria-label="Forward 15 seconds">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button type="button" class="sp-btn sp-speed" aria-label="Playback speed">1×</button>
        <span class="sp-time"><span class="sp-cur">0:00</span> / <span class="sp-dur">0:00</span></span>
        <span class="sp-spacer"></span>
        <button type="button" class="sp-btn sp-cc on" aria-label="Captions" aria-pressed="true">CC</button>
        <button type="button" class="sp-btn sp-pip" aria-label="Picture in picture">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor"/></svg>
        </button>
        <button type="button" class="sp-btn sp-fs" aria-label="Full screen">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9V4h5M21 9V4h-5M3 15v5h5M21 15v5h-5"/></svg>
        </button>
      </div>
    </div>
  </div>
  {%- if include.title or include.youtube %}
  <figcaption class="sp-meta">
    <span class="sp-title">{{ include.title }}</span>
    {%- if include.youtube %}<a class="sp-yt" href="{{ include.youtube }}" rel="noopener" target="_blank">Watch on YouTube</a>{% endif %}
  </figcaption>
  {%- endif %}
</figure>

<style>
.sp-wrap{margin:1.6em 0 2em;--sp-accent:#ff6719}
.sp-stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;user-select:none;-webkit-user-select:none}
.sp-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}
.sp-video::cue{opacity:0;color:transparent;background:transparent}
.sp-big{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;border:0;border-radius:9999px;background:rgba(40,40,40,.75);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,opacity .2s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sp-big svg{margin-left:4px}
.sp-big:hover{transform:scale(1.06)}
.sp-wrap.playing .sp-big{opacity:0;pointer-events:none}
.sp-caption{position:absolute;left:6%;right:6%;bottom:9%;text-align:center;color:#fff;font:600 clamp(14px,2.6vw,26px)/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:-.01em;text-shadow:0 0 4px rgba(0,0,0,.9),0 1px 2px rgba(0,0,0,.9);pointer-events:none;transition:bottom .25s}
.sp-wrap.show .sp-caption{bottom:calc(9% + 34px)}
.sp-wrap.nocc .sp-caption{display:none}
.sp-modes{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;padding:4px;border-radius:9999px;background:rgba(40,40,40,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.sp-mode{width:30px;height:30px;border:0;border-radius:9999px;background:transparent;color:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;cursor:pointer}
.sp-mode.on{background:rgba(255,255,255,.18);color:#fff}
.sp-audio-card{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#111;color:rgba(255,255,255,.75);font:500 14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.sp-audio-card img{width:38%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.sp-wrap.audio .sp-audio-card{display:flex}
.sp-bar{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 4px;background:linear-gradient(to top,rgba(0,0,0,.65),rgba(0,0,0,0));transform:translateY(100%);transition:transform .3s .1s}
.sp-wrap.show .sp-bar,.sp-wrap:not(.started) .sp-bar{transform:none}
.sp-wrap.show .sp-modes{opacity:1}
.sp-wrap:not(.started) .sp-bar{opacity:0;pointer-events:none}
.sp-progress{position:relative;height:14px;margin:0 4px;cursor:pointer;touch-action:none}
.sp-progress>div{position:absolute;left:0;top:6px;height:3px;border-radius:2px}
.sp-progress:before{content:"";position:absolute;left:0;right:0;top:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.25)}
.sp-buf{background:rgba(255,255,255,.4);width:0}
.sp-fill{background:#fff;width:0}
.sp-knob{width:11px!important;height:11px!important;top:2px!important;margin-left:-5px;border-radius:50%!important;background:#fff;left:0;opacity:0;transition:opacity .15s}
.sp-progress:hover .sp-knob,.sp-progress.drag .sp-knob{opacity:1}
.sp-progress:hover>div:not(.sp-knob){top:5px;height:5px}
.sp-row{display:flex;align-items:center;gap:2px;color:#fff;font:500 12.5px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.sp-btn{min-width:32px;height:32px;padding:0 6px;border:0;border-radius:6px;background:transparent;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit;opacity:.92}
.sp-btn:hover{background:rgba(255,255,255,.14);opacity:1}
.sp-cc{font-size:10.5px;font-weight:700;letter-spacing:.03em}
.sp-cc:not(.on){opacity:.5}
.sp-play .i-pause{display:none}
.sp-wrap.playing .sp-play .i-pause{display:block}
.sp-wrap.playing .sp-play .i-play{display:none}
.sp-time{padding:0 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sp-spacer{flex:1}
.sp-stage:fullscreen{border-radius:0}
.sp-meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:.6em;font-size:.85em;color:#6b6b6b}
.sp-yt{white-space:nowrap}
@media (max-width:560px){.sp-back,.sp-fwd,.sp-pip{display:none}.sp-big{width:60px;height:60px;margin:-30px 0 0 -30px}}
</style>

<script>
(function(){
  var root=document.getElementById({{ pid | jsonify }});if(!root)return;
  var v=root.querySelector('.sp-video'),stage=root.querySelector('.sp-stage'),cap=root.querySelector('.sp-caption'),
      prog=root.querySelector('.sp-progress'),fill=root.querySelector('.sp-fill'),buf=root.querySelector('.sp-buf'),
      knob=root.querySelector('.sp-knob'),cur=root.querySelector('.sp-cur'),dur=root.querySelector('.sp-dur'),
      speedBtn=root.querySelector('.sp-speed'),ccBtn=root.querySelector('.sp-cc'),hideT;
  var speeds=[1,1.25,1.5,1.75,2,0.75];
  function fmt(s){s=Math.max(0,Math.floor(s||0));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');}
  function toggle(){if(v.paused){v.play();}else{v.pause();}}
  function show(){root.classList.add('show');clearTimeout(hideT);if(!v.paused)hideT=setTimeout(function(){root.classList.remove('show');},2500);}
  root.querySelector('.sp-big').onclick=toggle;
  root.querySelector('.sp-play').onclick=toggle;
  v.addEventListener('click',toggle);
  root.querySelector('.sp-back').onclick=function(){v.currentTime=Math.max(0,v.currentTime-15);};
  root.querySelector('.sp-fwd').onclick=function(){v.currentTime=Math.min(v.duration||0,v.currentTime+15);};
  speedBtn.onclick=function(){var i=(speeds.indexOf(v.playbackRate)+1)%speeds.length;v.playbackRate=speeds[i];speedBtn.textContent=speeds[i]+'×';};
  ccBtn.onclick=function(){var on=!ccBtn.classList.contains('on');ccBtn.classList.toggle('on',on);ccBtn.setAttribute('aria-pressed',on);root.classList.toggle('nocc',!on);};
  root.querySelector('.sp-pip').onclick=function(){if(document.pictureInPictureElement){document.exitPictureInPicture();}else if(v.requestPictureInPicture){v.requestPictureInPicture();}};
  root.querySelector('.sp-fs').onclick=function(){if(document.fullscreenElement){document.exitFullscreen();}else if(stage.requestFullscreen){stage.requestFullscreen();}else if(v.webkitEnterFullscreen){v.webkitEnterFullscreen();}};
  root.querySelectorAll('.sp-mode').forEach(function(b){b.onclick=function(){root.querySelectorAll('.sp-mode').forEach(function(x){x.classList.toggle('on',x===b);});root.classList.toggle('audio',b.dataset.mode==='audio');};});
  v.addEventListener('play',function(){root.classList.add('playing','started');show();});
  v.addEventListener('pause',function(){root.classList.remove('playing');show();});
  v.addEventListener('loadedmetadata',function(){dur.textContent=fmt(v.duration);});
  v.addEventListener('timeupdate',function(){var p=v.duration?v.currentTime/v.duration*100:0;fill.style.width=p+'%';knob.style.left=p+'%';cur.textContent=fmt(v.currentTime);});
  v.addEventListener('progress',function(){try{if(v.buffered.length)buf.style.width=(v.buffered.end(v.buffered.length-1)/v.duration*100)+'%';}catch(e){}});
  stage.addEventListener('mousemove',show);stage.addEventListener('touchstart',show,{passive:true});
  stage.addEventListener('mouseleave',function(){if(!v.paused)root.classList.remove('show');});
  function seek(e){var r=prog.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;v.currentTime=Math.min(Math.max(x/r.width,0),1)*(v.duration||0);}
  prog.addEventListener('pointerdown',function(e){prog.classList.add('drag');prog.setPointerCapture(e.pointerId);seek(e);});
  prog.addEventListener('pointermove',function(e){if(prog.classList.contains('drag'))seek(e);});
  prog.addEventListener('pointerup',function(){prog.classList.remove('drag');});
  prog.addEventListener('keydown',function(e){if(e.key==='ArrowRight')v.currentTime+=5;if(e.key==='ArrowLeft')v.currentTime-=5;});
  root.addEventListener('keydown',function(e){if(e.target===prog)return;if(e.key===' '||e.key==='k'){e.preventDefault();toggle();}});
  var t=v.textTracks&&v.textTracks[0];
  if(t){t.mode='hidden';t.addEventListener('cuechange',function(){var c=t.activeCues;cap.textContent=c&&c.length?c[0].text:'';});}
})();
</script>
