<link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}">
<script>(function(){var t=null;try{t=localStorage.getItem('st-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})();</script>
<button type="button" class="theme-toggle" data-label-dark="{% if page.lang == 'hi' %}डार्क थीम पर जाएँ{% else %}Switch to dark theme{% endif %}" data-label-light="{% if page.lang == 'hi' %}लाइट थीम पर जाएँ{% else %}Switch to light theme{% endif %}"><svg class="theme-toggle-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M20.7 14.6A8.5 8.5 0 0 1 9.4 3.3a8.5 8.5 0 1 0 11.3 11.3z"/></svg><svg class="theme-toggle-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg></button>
<script>(function(){var d=document.documentElement,b=document.currentScript.previousElementSibling;function sync(){var dark=d.getAttribute('data-theme')==='dark';b.setAttribute('aria-label',dark?b.getAttribute('data-label-light'):b.getAttribute('data-label-dark'));b.title=b.getAttribute('aria-label')}sync();b.addEventListener('click',function(){var t=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',t);try{localStorage.setItem('st-theme',t)}catch(e){}sync()});if(window.matchMedia){var m=matchMedia('(prefers-color-scheme: dark)'),f=function(e){var s=null;try{s=localStorage.getItem('st-theme')}catch(x){}if(!s){d.setAttribute('data-theme',e.matches?'dark':'light');sync()}};m.addEventListener?m.addEventListener('change',f):m.addListener&&m.addListener(f)}})();</script>
