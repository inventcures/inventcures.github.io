<text x='20.0' y='520.0' font-family='Helvetica, Arial, sans-serif' font-size='11' fill='#6b6b6b' text-anchor='start' font-weight='normal' stroke='white' stroke-width='3' paint-order='stroke'>host per model, temperature 1.0; clinic order and the labelled clinic randomised per trial. Closed models: 60 labelled trials each, from</text>
