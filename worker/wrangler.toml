# Cloudflare Worker for city-level visitor stats. See docs/city-visitor-stats-spec.md.
name = "visitor-cities"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://inventcures.github.io"
K_ANON = "5"

[[d1_databases]]
binding = "DB"
database_name = "visitor-cities"
# Filled in by .github/workflows/deploy-city-stats.yml at deploy time.
database_id = "00000000-0000-0000-0000-000000000000"
